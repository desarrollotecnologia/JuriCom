<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/app/assets/dm1.ico?v=3" type="image/x-icon" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contratos · JURICOM</title>
        <link rel="stylesheet" href="/static/styles/theme.css" />
        <style>
            .detail-section h3 {
                color: var(--color-primary-dark);
                font-size: 0.95rem;
                margin: 18px 0 10px;
                padding-bottom: 6px;
                border-bottom: 1px solid var(--color-border);
            }
            .detail-section p {
                font-size: 0.9rem;
                margin-bottom: 6px;
            }
            .detail-section .label {
                color: var(--color-text-muted);
                display: inline-block;
                min-width: 130px;
            }
            .juridica-actions {
                background: var(--color-primary-light);
                padding: 16px;
                border-radius: var(--radius-md);
                margin-top: 16px;
            }
            .juridica-actions h3 {
                color: var(--color-primary-dark);
                margin-bottom: 12px;
                font-size: 1rem;
            }
            .action-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            @media (max-width: 600px) {
                .action-grid { grid-template-columns: 1fr; }
            }
            .file-upload {
                background: white;
                padding: 12px;
                border-radius: 8px;
                border: 1px dashed var(--color-border);
            }
            .file-upload label {
                display: block;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--color-primary-dark);
                margin-bottom: 6px;
            }
            .file-upload .status {
                font-size: 0.78rem;
                margin-top: 4px;
            }
            .file-upload .status.ok { color: var(--color-success); }
            .file-upload .status.pending { color: var(--color-warning); }
            .poliza-required-banner {
                background: #fff7ed;
                border-left: 4px solid var(--color-warning);
                padding: 12px 14px;
                border-radius: 6px;
                color: #92400e;
                font-size: 0.9rem;
                margin-bottom: 16px;
            }
            table.clickable-rows tbody tr.contrato-vencimiento-alerta {
                background: #fef2f2;
                border-left: 4px solid var(--color-danger);
            }
            table.clickable-rows tbody tr.contrato-vencimiento-alerta:hover {
                background: #fee2e2;
            }
            table.clickable-rows tbody tr.contrato-eliminado {
                background: #f8fafc;
                color: var(--color-text-muted);
            }
            .vigencia-alert {
                background: #fef2f2;
                border-left: 4px solid var(--color-danger);
                padding: 12px 14px;
                border-radius: 6px;
                color: #991b1b;
                font-size: 0.9rem;
                margin-bottom: 16px;
            }
            .edit-contract-form {
                display: none;
                background: white;
                border: 1px solid var(--color-border);
                border-radius: 8px;
                padding: 12px;
                margin-bottom: 14px;
            }
            .edit-contract-form textarea {
                min-height: 58px;
                resize: vertical;
            }
            /* ----------- Otrosíes ----------- */
            .otrosi-section {
                background: #f0fdf4;
                border: 1px solid #bbf7d0;
                padding: 16px;
                border-radius: var(--radius-md);
                margin-top: 16px;
            }
            .otrosi-section h3 {
                color: #166534;
                font-size: 1rem;
                margin-bottom: 10px;
            }
            .otrosi-list {
                list-style: none;
                padding: 0;
                margin: 0 0 12px;
            }
            .otrosi-item {
                background: white;
                border-left: 4px solid #16a34a;
                padding: 10px 12px;
                border-radius: 6px;
                margin-bottom: 8px;
                font-size: 0.88rem;
            }
            .otrosi-item .otrosi-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: 600;
                color: #166534;
                margin-bottom: 4px;
            }
            .otrosi-item .otrosi-desc {
                color: var(--color-text-muted);
                font-size: 0.85rem;
                margin-top: 4px;
            }
            .otrosi-empty {
                color: var(--color-text-muted);
                font-size: 0.85rem;
                font-style: italic;
                margin-bottom: 12px;
            }
            .otrosi-form {
                background: white;
                border: 1px dashed #86efac;
                padding: 12px;
                border-radius: 8px;
            }
            .otrosi-form .row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            @media (max-width: 600px) {
                .otrosi-form .row { grid-template-columns: 1fr; }
            }
            .otrosi-form label {
                display: block;
                font-size: 0.82rem;
                font-weight: 600;
                color: #166534;
                margin: 8px 0 4px;
            }
            .otrosi-form input, .otrosi-form select, .otrosi-form textarea {
                width: 100%;
                font-size: 0.9rem;
                padding: 6px 8px;
                border: 1px solid var(--color-border);
                border-radius: 4px;
            }
            .otrosi-form textarea { min-height: 60px; resize: vertical; }
            .otrosi-form .tipo-block {
                border: 1px solid #bbf7d0;
                border-radius: 6px;
                padding: 8px 10px;
            }
            .otrosi-form .tipo-block.off { opacity: 0.5; }
            .otrosi-form .tipo-check {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                color: #166534;
                margin: 0 0 4px;
            }
            .otrosi-form .tipo-check input { width: auto; }
            .otrosi-disabled-msg {
                color: var(--color-text-muted);
                font-style: italic;
                font-size: 0.85rem;
            }
        </style>
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar" id="sidebar"></aside>
            <main class="main">
                <div class="page-header">
                    <div>
                        <h1 id="page-title">Contratos</h1>
                        <p class="muted" id="page-subtitle"></p>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <a
                            href="/app/juridica/gestion-juridica.html"
                            class="btn btn-secondary"
                            id="btn-volver-juridica"
                            style="display: none;"
                        >
                            Volver
                        </a>
                        <div id="buzon-btn-slot"></div>
                        <button
                            class="btn btn-secondary"
                            id="btn-notificar"
                            style="display: none;"
                            title="Enviar correo de advertencia con contratos pendientes"
                        >
                            ✉ Notificar pendientes
                        </button>
                        <button
                            class="btn btn-secondary"
                            id="btn-vencimientos"
                            style="display: none;"
                            title="Enviar correo con contratos cuya notificación fue programada por Jurídica"
                        >
                            ⚠ Notificar programados
                        </button>
                        <a
                            href="/app/compras/solicitud-radicar.html"
                            class="btn btn-primary"
                            id="btn-new"
                            style="display: none;"
                        >
                            + Radicar nuevo
                        </a>
                    </div>
                </div>

                <div class="alert alert-error" id="alert-error"></div>
                <div class="alert alert-success" id="alert-success"></div>

                <div class="card">
                    <div class="search-bar">
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Buscar por código (C-0001 u OS-0001), proveedor o NIT..."
                            autocomplete="off"
                        />
                        <select id="filter-estado">
                            <option value="">Todos los estados</option>
                            <option value="en_proceso">En proceso</option>
                            <option value="elaborando">Elaborando contrato</option>
                            <option value="activo">Activo</option>
                            <option value="finalizado">Finalizado</option>
                        </select>
                        <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;">
                            <input type="checkbox" id="filter-eliminados" />
                            Ver eliminados
                        </label>
                        <span class="info" id="result-count"></span>
                    </div>

                    <table class="clickable-rows">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Proveedor</th>
                                <th>NIT</th>
                                <th>Valor</th>
                                <th>Plazo</th>
                                <th>Vence</th>
                                <th>Notificación</th>
                                <th>Aprobación</th>
                                <th>Estado</th>
                                <th>Otrosíes</th>
                                <th>Faltantes</th>
                                <th>Radicado</th>
                            </tr>
                        </thead>
                        <tbody id="contratos-tbody">
                            <tr>
                                <td colspan="12" class="muted">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>

        <!-- Modal detalle -->
        <div class="modal-overlay" id="modal-detail">
            <div class="modal" style="max-width: 780px;">
                <h2 id="detail-title">Detalle del contrato</h2>
                <div id="detail-content" class="mt-2"></div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="btn-detail-close">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>

        <script type="module">
            import { session } from "/static/js/auth/session.js";
            import { renderSidebar } from "/static/js/components/sidebar.js";
            import { renderBuzonBtn } from "/static/js/components/buzon-btn.js";
            import { api, ApiError } from "/static/js/api/client.js";
            import { API_BASE } from "/static/js/utils/config.js";
            import {
                escapeHtml,
                formatDate,
                formatMoney,
                formatPlazo,
            } from "/static/js/utils/format.js";

            session.requireAuth();
            renderSidebar();
            renderBuzonBtn();

            const user = session.getUser();
            const puedeRadicar = ["compras", "admin"].includes(user.role);
            const esJuridica = ["juridica", "admin"].includes(user.role);
            const puedeAplicarOtrosi = esJuridica || user.role === "compras";

            document.getElementById("page-subtitle").textContent =
                user.role === "compras"
                    ? "Solicitudes que has radicado."
                    : "Todas las solicitudes radicadas en el sistema.";
            if (puedeRadicar) {
                document.getElementById("btn-new").style.display = "inline-flex";
            }
            if (esJuridica) {
                document.getElementById("btn-notificar").style.display = "inline-flex";
                document.getElementById("btn-vencimientos").style.display = "inline-flex";
                document.getElementById("btn-volver-juridica").style.display = "inline-flex";
            }

            const tbody = document.getElementById("contratos-tbody");
            const modal = document.getElementById("modal-detail");
            const detailContent = document.getElementById("detail-content");
            const searchInput = document.getElementById("search-input");
            const filterEstado = document.getElementById("filter-estado");
            const filterEliminados = document.getElementById("filter-eliminados");
            const resultCount = document.getElementById("result-count");
            const alertError = document.getElementById("alert-error");
            const alertSuccess = document.getElementById("alert-success");

            const TIPO_LABEL = {
                camara_comercio: "Cámara de comercio",
                cotizacion: "Cotización",
                cedula_rep_legal: "Cédula rep. legal",
                correo_aprobacion_gerencia: "Aprobación gerencia",
                correo_aprobacion_lider: "Aprobación líder",
                opcional: "Archivo opcional",
                poliza: "Póliza",
                borrador_firmado: "Contrato firmado",
                otrosi: "Otrosí firmado",
                informe_final: "Informe final",
                acta_liquidacion: "Acta de liquidación",
                respuesta_informacion: "Respuesta a información",
            };

            const ESTADO_LABEL = {
                en_proceso: "Pendiente",
                revision: "Revisión",
                elaborando: "Elaborando contrato",
                revision_polizas: "Revisión de pólizas",
                solicitud_firmas: "Solicitud de firmas",
                anticipo_contabilidad: "Anticipo en contabilidad",
                anticipo_tesoreria: "Anticipo en tesorería",
                anticipo_pagado: "Anticipo pagado",
                activo: "Activo",
                finalizado: "Finalizado",
            };

            const APROBACION_LABEL = {
                pendiente_lider: "Pendiente líder",
                pendiente_gerencia: "Pendiente gerencia",
                aprobado: "Aprobado",
                rechazado: "Rechazado",
            };

            function badgeElaboracion(dias) {
                if (dias === null || dias === undefined) return "";
                let bg, fg, texto;
                if (dias > 1) { bg = "#dcfce7"; fg = "#166534"; texto = `${dias} Días`; }
                else if (dias === 1) { bg = "#fef3c7"; fg = "#b45309"; texto = "1 Día"; }
                else if (dias === 0) { bg = "#fef3c7"; fg = "#b45309"; texto = "Hoy"; }
                else { bg = "#fee2e2"; fg = "#991b1b"; texto = `Vencido ${Math.abs(dias)} Día${Math.abs(dias) === 1 ? "" : "s"}`; }
                return `<br><span style="background:${bg};color:${fg};padding:1px 7px;border-radius:999px;font-weight:600;font-size:0.72rem;white-space:nowrap;display:inline-block;margin-top:3px;">${texto}</span>`;
            }

            const TIPO_OTROSI_LABEL = {
                prorroga: "Prórroga",
                adicion: "Adición",
                prorroga_adicion: "Prórroga + Adición",
                modificacion: "Modificación",
                otro: "Otro",
            };

            const UNIDAD_PLAZO_LABEL = {
                dias: "días hábiles",
                dias_calendario: "días calendario",
                meses: "meses",
                anios: "años",
            };

            function showError(msg) {
                alertSuccess.classList.remove("show");
                alertError.textContent = msg;
                alertError.classList.add("show");
                setTimeout(() => alertError.classList.remove("show"), 6000);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
            function showSuccess(msg) {
                alertError.classList.remove("show");
                alertSuccess.textContent = msg;
                alertSuccess.classList.add("show");
                setTimeout(() => alertSuccess.classList.remove("show"), 5000);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
            function formatHora(value) {
                return value ? String(value).slice(0, 5) : "07:30";
            }

            let timer = null;
            function debouncedLoad() {
                clearTimeout(timer);
                timer = setTimeout(load, 300);
            }
            searchInput.addEventListener("input", debouncedLoad);
            filterEstado.addEventListener("change", load);
            filterEliminados.addEventListener("change", load);

            async function load() {
                const params = new URLSearchParams();
                if (searchInput.value.trim()) params.set("q", searchInput.value.trim());
                if (filterEstado.value) params.set("estado", filterEstado.value);
                if (filterEliminados.checked) params.set("eliminados", "true");
                const url = "/contratos" + (params.toString() ? `?${params}` : "");

                try {
                    const items = await api.get(url);
                    resultCount.textContent = `${items.length} resultado(s)`;
                    if (items.length === 0) {
                        tbody.innerHTML =
                            '<tr><td colspan="12" class="muted">No se encontraron contratos.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = items
                        .map((c) => {
                            const faltantes = [];
                            if (c.requiere_poliza && !c.tiene_poliza) faltantes.push("Póliza");
                            if (!c.tiene_borrador) faltantes.push("Borrador");
                            const faltantesHtml =
                                faltantes.length === 0
                                    ? '<span class="muted">—</span>'
                                    : faltantes
                                          .map((f) => `<span class="badge badge-en_proceso" style="margin-right:4px;">${f}</span>`)
                                          .join("");
                            const otrosiCount = c.cantidad_otrosies ?? 0;
                            const otrosiHtml = otrosiCount > 0
                                ? `<span class="badge badge-activo" title="Tiene ${otrosiCount} otrosí(es) aplicado(s)">${otrosiCount}</span>`
                                : '<span class="muted">—</span>';
                            const venceHtml = c.fecha_fin
                                ? `${formatDate(c.fecha_fin)}${c.alerta_vencimiento ? `<br><span class="badge badge-finalizado">${c.dias_para_vencer} días</span>` : ""}`
                                : '<span class="muted">—</span>';
                            const notificacionHtml = c.fecha_proxima_notificacion
                                ? formatDate(c.fecha_proxima_notificacion)
                                : '<span class="muted">Sin programar</span>';
                            const aprobacionHtml = `<span class="badge badge-${c.estado_aprobacion === "aprobado" ? "activo" : "en_proceso"}">${APROBACION_LABEL[c.estado_aprobacion] || c.estado_aprobacion}</span>`;
                            const eliminado = Boolean(c.eliminado_at);
                            const estadoHtml = eliminado
                                ? '<span class="badge badge-finalizado">Eliminado</span>'
                                : `<span class="badge badge-${c.estado}">${ESTADO_LABEL[c.estado] || c.estado}</span>${badgeElaboracion(c.dias_para_elaborar)}`;
                            const faltantesFinal = eliminado
                                ? `<span title="${escapeHtml(c.eliminado_observacion || "")}">${escapeHtml(c.eliminado_observacion || "Sin observación")}</span>`
                                : faltantesHtml;
                            return `
                                <tr data-id="${c.id}" tabindex="0" role="button"
                                    class="${eliminado ? "contrato-eliminado" : c.alerta_vencimiento ? "contrato-vencimiento-alerta" : ""}"
                                    aria-label="Abrir contrato ${escapeHtml(c.codigo ?? '')}">
                                    <td><span class="codigo-contrato">${escapeHtml(c.codigo ?? "—")}</span></td>
                                    <td><strong>${escapeHtml(c.proveedor_contratista)}</strong></td>
                                    <td>${escapeHtml(c.nit_proveedor)}</td>
                                    <td>${formatMoney(c.valor, c.moneda)}</td>
                                    <td>${formatPlazo(c.plazo_cantidad, c.plazo_unidad)}</td>
                                    <td>${venceHtml}</td>
                                    <td>${notificacionHtml}</td>
                                    <td>${aprobacionHtml}</td>
                                    <td>${estadoHtml}</td>
                                    <td>${otrosiHtml}</td>
                                    <td>${faltantesFinal}</td>
                                    <td>${formatDate(c.created_at)}</td>
                                </tr>
                            `;
                        })
                        .join("");
                } catch (err) {
                    tbody.innerHTML = `<tr><td colspan="11" class="muted">Error: ${escapeHtml(err.message)}</td></tr>`;
                }
            }

            tbody.addEventListener("click", async (e) => {
                const row = e.target.closest("tr[data-id]");
                if (!row) return;
                await openDetail(row.dataset.id);
            });
            tbody.addEventListener("keydown", async (e) => {
                if (e.key !== "Enter" && e.key !== " ") return;
                const row = e.target.closest("tr[data-id]");
                if (!row) return;
                e.preventDefault();
                await openDetail(row.dataset.id);
            });

            detailContent.addEventListener("click", async (e) => {
                const link = e.target.closest("a[data-download-url]");
                if (!link) return;
                e.preventDefault();
                await downloadArchivo(link.dataset.downloadUrl, link.dataset.filename);
            });

            async function downloadArchivo(path, filename) {
                try {
                    const response = await fetch(`${API_BASE}${path.replace("/api/v1", "")}`, {
                        headers: {
                            Authorization: `Bearer ${session.getToken()}`,
                        },
                    });
                    if (!response.ok) {
                        throw new Error(`No se pudo descargar el archivo (${response.status}).`);
                    }
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = filename || "archivo";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                } catch (err) {
                    showError(err.message || "No se pudo descargar el archivo.");
                }
            }

            async function openDetail(id) {
                try {
                    const c = await api.get(`/contratos/${id}`);
                    renderDetail(c);
                    modal.classList.add("show");
                } catch (err) {
                    showError(err.message);
                }
            }

            function anticipoDetalleHtml(c) {
                if (!c.requiere_anticipo && !c.monto_anticipo && !c.porcentaje_anticipo && !c.observaciones_anticipo) {
                    return "";
                }
                const partes = [c.requiere_anticipo ? "Sí" : "No"];
                if (c.porcentaje_anticipo) partes.push(`${Number(c.porcentaje_anticipo)}%`);
                if (c.monto_anticipo) partes.push(formatMoney(c.monto_anticipo, c.moneda));
                const obs = c.observaciones_anticipo
                    ? `<br><span class="muted">${escapeHtml(c.observaciones_anticipo)}</span>`
                    : "";
                return `<p><span class="label">Anticipo:</span> ${partes.join(" · ")}${obs}</p>`;
            }

            function renderDetail(c) {
                document.getElementById("detail-title").textContent =
                    `Contrato ${c.codigo || ""}`;

                const archivosHtml = c.archivos
                    .map(
                        (a) => `
                            <li>
                                <strong>${TIPO_LABEL[a.tipo] || a.tipo}:</strong>
                                <a href="#" data-download-url="/api/v1/archivos/${c.id}/${a.id}" data-filename="${escapeHtml(a.nombre_original)}">
                                    ${escapeHtml(a.nombre_original)}
                                </a>
                                <span class="muted">(${(a.tamano_bytes / 1024).toFixed(1)} KB)</span>
                            </li>
                        `
                    )
                    .join("");

                const polizaWarning =
                    c.requiere_poliza && !c.tiene_poliza
                        ? `<div class="poliza-required-banner">
                              ⚠ Este contrato requiere PÓLIZA y aún no se ha adjuntado.
                              ${esJuridica ? "Adjúntala en elaboración (abajo)." : "La adjunta Jurídica o Gerencia durante la elaboración."}
                           </div>`
                        : "";
                const vigenciaWarning =
                    c.alerta_vencimiento
                        ? `<div class="vigencia-alert">
                              Cuidado: este contrato vence en ${c.dias_para_vencer} día(s).
                              Consulta con el líder del proceso y Jurídica si se va a renovar
                              o si se dejará vencer.
                           </div>`
                        : "";
                const eliminado = Boolean(c.eliminado_at);
                const eliminadoWarning = eliminado
                    ? `<div class="vigencia-alert">
                          Este contrato fue eliminado el ${formatDate(c.eliminado_at)}.
                          <br><strong>Observación:</strong> ${escapeHtml(c.eliminado_observacion || "Sin observación")}
                       </div>`
                    : "";

                const juridicaActionsHtml = esJuridica && !eliminado
                    ? buildJuridicaActions(c)
                    : "";
                const otrosiSectionHtml =
                    !eliminado && (puedeAplicarOtrosi || c.estado === "activo" || (c.otrosies || []).length > 0)
                        ? buildOtrosiSection(c)
                        : "";

                detailContent.innerHTML = `
                    ${eliminadoWarning}
                    ${vigenciaWarning}
                    ${polizaWarning}
                    <div class="detail-section">
                        <p>
                            <span class="codigo-contrato">${escapeHtml(c.codigo ?? "—")}</span>
                            &nbsp;
                            ${eliminado
                                ? '<span class="badge badge-finalizado">Eliminado</span>'
                                : `<span class="badge badge-${c.estado}">${ESTADO_LABEL[c.estado] || c.estado}</span>`
                            }
                        </p>

                        <h3>Información general</h3>
                        <p><span class="label">Compañía:</span> ${escapeHtml(c.compania)}</p>
                        ${
                            c.solicitud_gestion_codigo
                                ? `<p><span class="label">Origen SRV:</span>
                                    <strong class="codigo-solicitud">${escapeHtml(c.solicitud_gestion_codigo)}</strong>
                                    <span class="muted"> (esta OT/contrato nació de esa solicitud de servicios)</span>
                                   </p>`
                                : ""
                        }
                        <p><span class="label">Proveedor:</span> <strong>${escapeHtml(c.proveedor_contratista)}</strong></p>
                        <p><span class="label">NIT:</span> ${escapeHtml(c.nit_proveedor)}</p>
                        <p><span class="label">Valor:</span> ${formatMoney(c.valor, c.moneda)}</p>
                        <p><span class="label">Plazo:</span> ${formatPlazo(c.plazo_cantidad, c.plazo_unidad)}</p>
                        <p><span class="label">Inicio:</span> ${c.fecha_inicio ? formatDate(c.fecha_inicio) : "Sin definir"}</p>
                        <p><span class="label">Fin:</span> ${c.fecha_fin ? formatDate(c.fecha_fin) : "Sin definir"}</p>
                        <p><span class="label">Volver a notificar:</span> ${c.fecha_proxima_notificacion ? formatDate(c.fecha_proxima_notificacion) : "Sin programar"}</p>
                        <p><span class="label">Aprobación:</span> ${APROBACION_LABEL[c.estado_aprobacion] || c.estado_aprobacion}</p>
                        <p><span class="label">Líder proceso:</span> ${escapeHtml(c.correo_lider_proceso || "—")}</p>
                        <p><span class="label">Gerencia:</span> ${escapeHtml(c.correo_gerencia || "—")}</p>
                        <p><span class="label">Renovación automática:</span> ${c.renovacion_automatica ? "Sí" : "No"}</p>
                        <p><span class="label">Requiere póliza:</span> ${c.requiere_poliza ? "Sí" : "No"}</p>
                        ${anticipoDetalleHtml(c)}

                        <h3>Descripción del servicio</h3>
                        <p class="muted">${escapeHtml(c.descripcion_servicio)}</p>

                        <h3>Obligaciones Colbeef</h3>
                        <p class="muted">${escapeHtml(c.obligaciones_colbeef)}</p>

                        <h3>Obligaciones del proveedor</h3>
                        <p class="muted">${escapeHtml(c.obligaciones_proveedor)}</p>

                        <h3>Condiciones de recibido satisfactorio</h3>
                        <p class="muted">${escapeHtml(c.condiciones_recibido_satisfactorio)}</p>

                        <h3>Archivos adjuntos (${c.archivos.length})</h3>
                        <ul style="padding-left: 20px;">${archivosHtml}</ul>
                    </div>

                    <div id="info-faltante-compras" class="detail-section"></div>

                    ${otrosiSectionHtml}

                    ${juridicaActionsHtml}
                `;

                if (!eliminado) cargarInfoFaltanteCompras(c);
                if (!eliminado && puedeAplicarOtrosi) wireOtrosiForm(c);
                if (!eliminado && esJuridica) wireJuridicaActions(c);
            }

            function puedeResponderInfo(c) {
                return user.role === "admin" || (user.role === "compras" && c.creado_por_id === user.id);
            }

            async function cargarInfoFaltanteCompras(c) {
                const cont = document.getElementById("info-faltante-compras");
                if (!cont) return;
                let items = [];
                try {
                    items = await api.get(`/contratos/${c.id}/solicitudes-informacion`);
                } catch (err) {
                    cont.innerHTML = "";
                    return;
                }
                if (!items.length) {
                    cont.innerHTML = "";
                    return;
                }
                const puedeResponder = puedeResponderInfo(c);
                cont.innerHTML = `
                    <h3>Información solicitada por Jurídica (${items.length})</h3>
                    ${items.map((s) => renderInfoItem(s, puedeResponder)).join("")}
                `;
                if (puedeResponder) {
                    items.filter((s) => s.estado !== "respondida").forEach((s) => {
                        const btn = document.getElementById(`btn-responder-info-${s.id}`);
                        if (btn) btn.addEventListener("click", () => responderInfo(c.id, s.id));
                    });
                }
            }

            function renderInfoItem(s, puedeResponder) {
                const respondida = s.estado === "respondida";
                const borde = respondida ? "#16a34a" : (s.vencida ? "#dc2626" : "#f59e0b");
                const limite = s.fecha_limite_respuesta ? formatDate(s.fecha_limite_respuesta) : "—";
                const estadoTxt = respondida
                    ? `Respondida por ${escapeHtml(s.respondido_por_username || "Compras")}`
                    : (s.vencida
                        ? "Pendiente — plazo vencido"
                        : `Pendiente — ${s.dias_para_responder ?? "?"} día(s) hábiles para responder`);
                const solicitante = escapeHtml(s.solicitado_por_username || "Jurídica");
                const htmlAdjuntos = (list) =>
                    list.length
                        ? `<div style="margin-top:6px;"><strong>Adjuntos:</strong> ${list
                              .map(
                                  (a) =>
                                      `<a href="#" data-download-url="/api/v1/archivos/${s.contrato_id}/${a.id}" data-filename="${escapeHtml(a.nombre_original)}">${escapeHtml(a.nombre_original)}</a>`
                              )
                              .join(" · ")}</div>`
                        : "";
                const adjuntosJuridica = (s.archivos || []).filter((a) => a.tipo === "solicitud_informacion");
                const adjuntosSupervisor = (s.archivos || []).filter((a) => a.tipo !== "solicitud_informacion");
                const respuestaHtml = respondida
                    ? `<div style="margin-top:8px;padding:8px 10px;background:#f0fdf4;border-radius:6px;">
                           <strong>Tu respuesta:</strong><br>${escapeHtml(s.respuesta).replace(/\n/g, "<br>")}
                           ${htmlAdjuntos(adjuntosSupervisor)}
                       </div>`
                    : "";
                const formHtml = (!respondida && puedeResponder)
                    ? `<div style="margin-top:10px;">
                           <textarea id="resp-info-${s.id}" rows="3" style="width:100%;" placeholder="Escribe la información solicitada..."></textarea>
                           <input type="file" id="files-info-${s.id}" multiple style="margin-top:6px;" />
                           <div style="display:flex;justify-content:flex-end;margin-top:6px;">
                               <button class="btn btn-sm btn-primary" id="btn-responder-info-${s.id}">Responder a Jurídica</button>
                           </div>
                       </div>`
                    : "";
                return `
                    <div style="border-left:4px solid ${borde};background:#f8fafc;border-radius:6px;padding:10px 12px;margin-bottom:10px;">
                        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                            <strong>${escapeHtml(estadoTxt)}</strong>
                            <span class="muted">Límite: ${limite}</span>
                        </div>
                        <div style="margin-top:6px;"><strong>${solicitante} solicitó:</strong> ${escapeHtml(s.mensaje).replace(/\n/g, "<br>")}</div>
                        ${htmlAdjuntos(adjuntosJuridica)}
                        ${respuestaHtml}
                        ${formHtml}
                    </div>`;
            }

            async function responderInfo(contratoId, solicitudId) {
                const respuesta = document.getElementById(`resp-info-${solicitudId}`).value.trim();
                if (!respuesta) {
                    showError("Escribe la información solicitada antes de responder.");
                    return;
                }
                const fd = new FormData();
                fd.append("respuesta", respuesta);
                const files = document.getElementById(`files-info-${solicitudId}`).files;
                for (const f of files) fd.append("archivos", f);
                const btn = document.getElementById(`btn-responder-info-${solicitudId}`);
                btn.disabled = true;
                try {
                    await api.postForm(`/contratos/${contratoId}/solicitudes-informacion/${solicitudId}/responder`, fd);
                    showSuccess("Respuesta enviada a Jurídica.");
                    const c = await api.get(`/contratos/${contratoId}`);
                    cargarInfoFaltanteCompras(c);
                } catch (err) {
                    showError(err.message || "No se pudo enviar la respuesta.");
                    btn.disabled = false;
                }
            }

            // El anticipo se envía desde "Solicitud de firmas": ahí ya se gestionó la
            // póliza y el contrato firmado. Notifica primero a Contabilidad y luego a Tesorería.
            function buildAnticipoAccionesHtml(c) {
                if (!esJuridica || !c.requiere_anticipo) return "";
                if (c.anticipo_pagado) {
                    return '<span class="status ok">✓ Anticipo pagado</span>';
                }
                if (c.estado === "anticipo_contabilidad") {
                    return '<span class="hint">Anticipo en gestión de Contabilidad</span>';
                }
                if (c.estado === "anticipo_tesoreria") {
                    return '<span class="hint">Anticipo en revisión de Tesorería</span>';
                }
                if (c.estado === "solicitud_firmas") {
                    const faltaFirmado = !c.tiene_borrador;
                    const faltaPoliza = c.requiere_poliza && !c.tiene_poliza;
                    if (faltaFirmado || faltaPoliza) {
                        const pendientes = [];
                        if (faltaPoliza) pendientes.push("la póliza");
                        if (faltaFirmado) pendientes.push("el contrato firmado");
                        return (
                            '<span class="hint">Para enviar el anticipo, primero gestiona ' +
                            escapeHtml(pendientes.join(" y ")) +
                            ".</span>"
                        );
                    }
                    return (
                        '<button type="button" class="btn btn-sm btn-primary" id="btn-enviar-anticipo" ' +
                        'title="Notifica a Contabilidad y luego a Tesorería para el pago del anticipo.">' +
                        "Enviar anticipo" +
                        "</button>"
                    );
                }
                return "";
            }

            function buildJuridicaActions(c) {
                const isFinalizado = c.estado === "finalizado";
                const polizaStatus = c.tiene_poliza
                    ? '<span class="status ok">✓ Adjuntada</span>'
                    : (c.requiere_poliza
                        ? '<span class="status pending">⚠ Pendiente (obligatoria)</span>'
                        : '<span class="status">Opcional</span>');
                const borradorStatus = c.tiene_borrador
                    ? '<span class="status ok">✓ Adjuntado</span>'
                    : '<span class="status pending">⚠ Pendiente</span>';
                const puedeSubirPoliza =
                    c.estado === "elaborando" ||
                    c.estado === "en_proceso" ||
                    (c.estado === "activo" && c.requiere_poliza && !c.tiene_poliza);

                return `
                    <div class="juridica-actions">
                        <h3>🔒 Acciones de Jurídica</h3>

                        <div style="margin-bottom:12px;">
                            <a
                                class="btn btn-sm btn-primary"
                                href="/app/juridica/editar-contrato.html?codigo=${encodeURIComponent(c.codigo || "")}"
                            >
                                Abrir en Edición de contrato
                            </a>
                            <span class="hint" style="margin-left:8px;">
                                Edita datos, vigencia, archivos y estado en el módulo aparte.
                            </span>
                        </div>

                        <div class="edit-contract-form">
                            <h3 style="margin-top:0;">Editar contrato y vigencia</h3>
                            <div class="row-2">
                                <div class="field">
                                    <label>Proveedor</label>
                                    <input id="edit-proveedor" value="${escapeHtml(c.proveedor_contratista)}" />
                                </div>
                                <div class="field">
                                    <label>NIT</label>
                                    <input id="edit-nit" value="${escapeHtml(c.nit_proveedor)}" />
                                </div>
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>Valor</label>
                                    <input id="edit-valor" type="number" step="0.01" min="0.01" value="${c.valor}" />
                                </div>
                                <div class="field">
                                    <label>Moneda</label>
                                    <select id="edit-moneda">
                                        <option value="COP" ${c.moneda === "COP" ? "selected" : ""}>COP</option>
                                        <option value="USD" ${c.moneda === "USD" ? "selected" : ""}>USD</option>
                                        <option value="EUR" ${c.moneda === "EUR" ? "selected" : ""}>EUR</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>Plazo</label>
                                    <input id="edit-plazo-cantidad" type="number" min="1" value="${c.plazo_cantidad}" />
                                </div>
                                <div class="field">
                                    <label>Unidad plazo</label>
                                    <select id="edit-plazo-unidad">
                                        <option value="dias" ${c.plazo_unidad === "dias" ? "selected" : ""}>Días (hábiles)</option>
                                        <option value="dias_calendario" ${c.plazo_unidad === "dias_calendario" ? "selected" : ""}>Días calendario</option>
                                        <option value="meses" ${c.plazo_unidad === "meses" ? "selected" : ""}>Meses</option>
                                        <option value="anios" ${c.plazo_unidad === "anios" ? "selected" : ""}>Años</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>Fecha inicio</label>
                                    <input id="edit-fecha-inicio" type="date" value="${c.fecha_inicio || ""}" />
                                </div>
                                <div class="field">
                                    <label>Fecha fin</label>
                                    <input id="edit-fecha-fin" type="date" value="${c.fecha_fin || ""}" />
                                </div>
                            </div>
                            <div class="field">
                                <label>Volver a notificar el</label>
                                <input id="edit-fecha-proxima-notificacion" type="date" value="${c.fecha_proxima_notificacion || ""}" />
                            </div>
                            <div class="field">
                                <label>Hora de notificación</label>
                                <input id="edit-hora-proxima-notificacion" type="time" value="${formatHora(c.hora_proxima_notificacion)}" />
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>Renovación automática</label>
                                    <select id="edit-renovacion">
                                        <option value="false" ${!c.renovacion_automatica ? "selected" : ""}>No</option>
                                        <option value="true" ${c.renovacion_automatica ? "selected" : ""}>Sí</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label>Requiere póliza</label>
                                    <select id="edit-poliza">
                                        <option value="false" ${!c.requiere_poliza ? "selected" : ""}>No</option>
                                        <option value="true" ${c.requiere_poliza ? "selected" : ""}>Sí</option>
                                    </select>
                                    <span class="hint">Lo define Jurídica en Edición de contrato.</span>
                                </div>
                            </div>
                            <div class="field">
                                <label>Descripción del servicio</label>
                                <textarea id="edit-descripcion">${escapeHtml(c.descripcion_servicio)}</textarea>
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>Obligaciones Colbeef</label>
                                    <textarea id="edit-obligaciones-colbeef">${escapeHtml(c.obligaciones_colbeef)}</textarea>
                                </div>
                                <div class="field">
                                    <label>Obligaciones proveedor</label>
                                    <textarea id="edit-obligaciones-proveedor">${escapeHtml(c.obligaciones_proveedor)}</textarea>
                                </div>
                            </div>
                            <div class="field">
                                <label>Condiciones recibido satisfactorio</label>
                                <textarea id="edit-condiciones">${escapeHtml(c.condiciones_recibido_satisfactorio)}</textarea>
                            </div>
                            <button class="btn btn-sm btn-primary" id="btn-save-contrato">
                                Guardar cambios del contrato
                            </button>
                        </div>

                        <div class="field">
                            <label>Estado del contrato</label>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <select id="select-estado" ${isFinalizado ? "" : ""}>
                                    <option value="en_proceso" ${c.estado === "en_proceso" ? "selected" : ""}>En proceso</option>
                                    <option value="elaborando" ${c.estado === "elaborando" ? "selected" : ""}>Elaborando contrato</option>
                                    <option value="revision_polizas" ${c.estado === "revision_polizas" ? "selected" : ""}>Revisión de pólizas</option>
                                    <option value="solicitud_firmas" ${c.estado === "solicitud_firmas" ? "selected" : ""}>Solicitud de firmas</option>
                                    ${c.estado === "anticipo_contabilidad" ? '<option value="anticipo_contabilidad" selected>Anticipo en contabilidad</option>' : ""}
                                    ${c.estado === "anticipo_tesoreria" ? '<option value="anticipo_tesoreria" selected>Anticipo en tesorería</option>' : ""}
                                    ${c.estado === "anticipo_pagado" ? '<option value="anticipo_pagado" selected>Anticipo pagado</option>' : ""}
                                    <option value="activo" ${c.estado === "activo" ? "selected" : ""}>Activo</option>
                                    <option value="finalizado" ${c.estado === "finalizado" ? "selected" : ""}>Finalizado</option>
                                </select>
                            </div>
                            <span class="hint">El estado se guarda automáticamente al seleccionarlo.</span>
                            <textarea id="obs-estado" class="mt-2" rows="2" placeholder="Observación (opcional): se guarda en la trazabilidad y el historial de observaciones." style="width:100%;"></textarea>
                            <span class="hint">
                                La póliza la adjunta Jurídica o Gerencia durante la elaboración. "Finalizado" cierra el contrato.
                            </span>
                        </div>

                        <div class="action-grid mt-2">
                            ${puedeSubirPoliza ? `
                            <div class="file-upload">
                                <label>
                                    📄 ${c.requiere_poliza ? "Póliza (obligatoria)" : "Póliza"}
                                </label>
                                <input type="file" id="file-poliza" accept="application/pdf,image/*" />
                                <button class="btn btn-sm btn-primary mt-2" id="btn-upload-poliza" style="margin-top:8px;">
                                    Subir póliza
                                </button>
                                ${polizaStatus}
                            </div>` : `
                            <div class="file-upload">
                                <label>📄 Póliza</label>
                                ${polizaStatus}
                                <span class="hint">La adjunta Jurídica o Gerencia durante la elaboración.</span>
                            </div>`}
                            <div class="file-upload">
                                <label>📋 Contrato firmado</label>
                                <input type="file" id="file-borrador" accept="application/pdf" />
                                <button class="btn btn-sm btn-primary mt-2" id="btn-upload-borrador" style="margin-top:8px;">
                                    Subir contrato firmado
                                </button>
                                ${borradorStatus}
                            </div>
                        </div>
                        <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--color-border); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                            <div>${buildAnticipoAccionesHtml(c)}</div>
                            <button class="btn btn-sm btn-secondary" id="btn-delete-contrato" style="color:#991b1b;">
                                Eliminar contrato
                            </button>
                        </div>
                    </div>
                `;

            function describeOtrosiEfecto(o) {
                const parts = [];
                if (o.plazo_adicional_cantidad) {
                    const u = UNIDAD_PLAZO_LABEL[o.plazo_adicional_unidad] || o.plazo_adicional_unidad || "";
                    parts.push(`+${o.plazo_adicional_cantidad} ${u}`);
                }
                if (o.valor_adicional) {
                    const v = Number(o.valor_adicional);
                    parts.push(`+${v.toLocaleString("es-CO", { minimumFractionDigits: 2 })}`);
                }
                return parts.length ? parts.join(" · ") : "Sin cambio en campos del contrato";
            }

            function otrosiBloquesHtml(c, otrosi) {
                const incP = otrosi ? (otrosi.tipo === "prorroga" || otrosi.tipo === "prorroga_adicion") : true;
                const incA = otrosi ? (otrosi.tipo === "adicion" || otrosi.tipo === "prorroga_adicion") : true;
                const u = UNIDAD_PLAZO_LABEL[c.plazo_unidad] || c.plazo_unidad;
                const plazoInner = esJuridica
                    ? `<label>Plazo adicional (en ${u}) *</label>
                       <input type="number" min="1" id="otrosi-plazo" placeholder="Ej: 30" value="${otrosi?.plazo_adicional_cantidad || ""}" />
                       <span class="hint" style="font-size:0.75rem;color:var(--color-text-muted);">Se sumará al plazo actual (${c.plazo_cantidad} ${u}).</span>`
                    : `<span class="hint" style="font-size:0.8rem;color:var(--color-text-muted);">Jurídica definirá el plazo adicional al finalizar.</span>`;
                return `
                    <p class="hint" style="font-size:0.8rem;color:var(--color-text-muted);margin-bottom:6px;">
                        Por defecto van prórroga y adición. Quita el que no necesites.
                    </p>
                    <div class="row">
                        <div class="tipo-block ${incP ? "" : "off"}" id="block-prorroga">
                            <label class="tipo-check"><input type="checkbox" id="chk-prorroga" ${incP ? "checked" : ""} /> Prórroga (más tiempo)</label>
                            ${plazoInner}
                        </div>
                        <div class="tipo-block ${incA ? "" : "off"}" id="block-adicion">
                            <label class="tipo-check"><input type="checkbox" id="chk-adicion" ${incA ? "checked" : ""} /> Adición (más valor)</label>
                            <label>Valor adicional (${c.moneda}) *</label>
                            <input type="number" min="0.01" step="0.01" id="otrosi-valor" placeholder="Ej: 1000000" value="${otrosi?.valor_adicional || ""}" />
                        </div>
                    </div>`;
            }

            function buildOtrosiSection(c) {
                const otrosies = c.otrosies || [];
                const otrosiPendienteJuridica = otrosies.find((o) =>
                    esJuridica
                    && o.estado_aprobacion === "aprobado"
                    && o.aprobado_gerencia_at
                    && !o.archivo_id
                );
                const listHtml = otrosies.length === 0
                    ? '<p class="otrosi-empty">Aún no se ha aplicado ningún otrosí a este contrato.</p>'
                    : `<ul class="otrosi-list">
                        ${otrosies.map((o) => `
                            <li class="otrosi-item">
                                <div class="otrosi-head">
                                    <span>Otrosí #${o.numero} · ${TIPO_OTROSI_LABEL[o.tipo] || o.tipo}</span>
                                    <span class="muted" style="font-weight:400;font-size:0.78rem;">${formatDate(o.created_at)}</span>
                                </div>
                                <div><strong>Efecto:</strong> ${escapeHtml(describeOtrosiEfecto(o))}</div>
                                <div class="otrosi-desc">${escapeHtml(o.descripcion)}</div>
                                ${o.archivo_id ? `
                                    <div style="margin-top:6px;">
                                        <a href="#" data-download-url="/api/v1/archivos/${c.id}/${o.archivo_id}" data-filename="otrosi-${o.numero}.pdf">📎 Descargar PDF del otrosí</a>
                                    </div>` : ""}
                            </li>
                        `).join("")}
                    </ul>`;

                const puedeCrear = puedeAplicarOtrosi && c.estado === "activo";
                const archivoFirmadoHtml = esJuridica
                    ? `
                        <label>PDF firmado del otrosí (solo Jurídica)</label>
                        <input type="file" id="otrosi-archivo" accept="application/pdf" />
                      `
                    : "";
                const descripcionFormulario = otrosiPendienteJuridica?.descripcion || "";
                const formularioHtml = otrosiPendienteJuridica
                    ? `
                        <div class="otrosi-form">
                            <p class="muted" style="margin-bottom:10px;">
                                Datos enviados por Compras. Jurídica puede ajustar tiempos, cargar el firmado y aplicar el cambio.
                            </p>
                            ${otrosiBloquesHtml(c, otrosiPendienteJuridica)}
                            <label>Descripción / motivo *</label>
                            <textarea id="otrosi-descripcion">${escapeHtml(descripcionFormulario)}</textarea>
                            ${archivoFirmadoHtml}
                            <button
                                class="btn btn-sm btn-primary"
                                id="btn-aplicar-otrosi"
                                data-otrosi-pendiente-id="${otrosiPendienteJuridica.id}"
                                style="margin-top:10px;"
                            >
                                Cargar firmado y aplicar otrosí
                            </button>
                        </div>
                      `
                    : (puedeCrear && !esJuridica
                    ? `
                        <div class="otrosi-form">
                            ${otrosiBloquesHtml(c, null)}
                            <label>Descripción / motivo *</label>
                            <textarea id="otrosi-descripcion" placeholder="Explica por qué se solicita el otrosí"></textarea>
                            ${archivoFirmadoHtml}
                            <button class="btn btn-sm btn-primary" id="btn-aplicar-otrosi" style="margin-top:10px;">
                                ${user.role === "compras" ? "Enviar solicitud de otrosí" : "Aplicar otrosí"}
                            </button>
                            ${user.role === "compras" ? `
                                <p class="muted" style="margin-top:8px;font-size:0.82rem;">
                                    La solicitud se enviará primero al líder del proceso y luego a gerencia.
                                    El PDF firmado sólo lo carga Jurídica cuando ambas aprobaciones estén listas.
                                </p>
                            ` : ""}
                        </div>
                      `
                    : (puedeAplicarOtrosi
                        ? `<p class="otrosi-disabled-msg">
                              ${esJuridica
                                  ? "No hay otrosí pendiente de firmado para este contrato."
                                  : `Para solicitar un otrosí, el contrato debe estar <strong>Activo</strong>. Estado actual: <strong>${ESTADO_LABEL[c.estado] || c.estado}</strong>.`
                              }
                           </p>`
                        : ""));

                return `
                    <div class="otrosi-section">
                        <h3>📑 Otrosíes (${otrosies.length})</h3>
                        ${listHtml}
                        ${formularioHtml}
                    </div>
                `;
            }

            function wireOtrosiForm(c) {
                if (c.estado !== "activo") return;
                const chkP = document.getElementById("chk-prorroga");
                const chkA = document.getElementById("chk-adicion");
                if (!chkP || !chkA) return;
                const submitBtn = document.getElementById("btn-aplicar-otrosi");
                const otrosiPendienteId = submitBtn?.dataset.otrosiPendienteId;

                function syncBloques() {
                    document.getElementById("block-prorroga").classList.toggle("off", !chkP.checked);
                    document.getElementById("block-adicion").classList.toggle("off", !chkA.checked);
                    const plazo = document.getElementById("otrosi-plazo");
                    if (plazo) plazo.disabled = !chkP.checked;
                    const valor = document.getElementById("otrosi-valor");
                    if (valor) valor.disabled = !chkA.checked;
                }
                syncBloques();
                chkP.addEventListener("change", syncBloques);
                chkA.addEventListener("change", syncBloques);

                submitBtn.addEventListener("click", async () => {
                    const incP = chkP.checked;
                    const incA = chkA.checked;
                    const tipo = incP && incA ? "prorroga_adicion" : incP ? "prorroga" : incA ? "adicion" : "";
                    if (!tipo) {
                        showError("Debes dejar al menos una: prórroga o adición.");
                        return;
                    }
                    const descripcion = document.getElementById("otrosi-descripcion").value.trim();
                    if (!descripcion) {
                        showError("La descripción / motivo del otrosí es obligatoria.");
                        return;
                    }
                    const fd = new FormData();
                    fd.append("tipo", tipo);
                    fd.append("descripcion", descripcion);
                    if (incP && esJuridica) {
                        // Compras solo solicita; Jurídica define el plazo al finalizar.
                        const v = document.getElementById("otrosi-plazo")?.value;
                        if (!v || Number(v) <= 0) {
                            showError("Debes indicar el plazo adicional (mayor a 0).");
                            return;
                        }
                        fd.append("plazo_adicional_cantidad", v);
                    }
                    if (incA) {
                        const v = document.getElementById("otrosi-valor")?.value;
                        if (!v || Number(v) <= 0) {
                            showError("Debes indicar el valor adicional (mayor a 0).");
                            return;
                        }
                        fd.append("valor_adicional", v);
                    }
                    const file = document.getElementById("otrosi-archivo")?.files[0];
                    if (otrosiPendienteId && !file) {
                        showError("Debes cargar el PDF firmado del otrosí.");
                        return;
                    }
                    if (esJuridica && file) fd.append("archivo", file);

                    try {
                        const endpoint = otrosiPendienteId
                            ? `/contratos/${c.id}/otrosi/${otrosiPendienteId}/finalizar`
                            : `/contratos/${c.id}/otrosi`;
                        await api.postForm(endpoint, fd);
                        showSuccess(
                            otrosiPendienteId
                                ? `Otrosí firmado cargado y aplicado al contrato ${c.codigo}.`
                                : user.role === "compras"
                                ? `Solicitud de otrosí enviada para el contrato ${c.codigo}.`
                                : `Otrosí aplicado correctamente al contrato ${c.codigo}.`
                        );
                        await openDetail(c.id);
                        load();
                    } catch (err) {
                        showError(err.message);
                    }
                });
            }

            function wireJuridicaActions(c) {
                document.getElementById("btn-save-contrato").addEventListener("click", async () => {
                    const payload = {
                        proveedor_contratista: document.getElementById("edit-proveedor").value.trim(),
                        nit_proveedor: document.getElementById("edit-nit").value.trim(),
                        descripcion_servicio: document.getElementById("edit-descripcion").value.trim(),
                        obligaciones_colbeef: document.getElementById("edit-obligaciones-colbeef").value.trim(),
                        obligaciones_proveedor: document.getElementById("edit-obligaciones-proveedor").value.trim(),
                        valor: Number(document.getElementById("edit-valor").value),
                        moneda: document.getElementById("edit-moneda").value,
                        plazo_cantidad: Number(document.getElementById("edit-plazo-cantidad").value),
                        plazo_unidad: document.getElementById("edit-plazo-unidad").value,
                        renovacion_automatica: document.getElementById("edit-renovacion").value === "true",
                        condiciones_recibido_satisfactorio: document.getElementById("edit-condiciones").value.trim(),
                        requiere_poliza: document.getElementById("edit-poliza").value === "true",
                        fecha_inicio: document.getElementById("edit-fecha-inicio").value || null,
                        fecha_fin: document.getElementById("edit-fecha-fin").value || null,
                        fecha_proxima_notificacion: document.getElementById("edit-fecha-proxima-notificacion").value || null,
                        hora_proxima_notificacion: document.getElementById("edit-hora-proxima-notificacion").value || "07:30",
                    };
                    if (!payload.proveedor_contratista || !payload.nit_proveedor || !payload.descripcion_servicio) {
                        showError("Completa proveedor, NIT y descripción.");
                        return;
                    }
                    try {
                        await api.put(`/contratos/${c.id}`, payload);
                        showSuccess("Contrato actualizado correctamente.");
                        await openDetail(c.id);
                        load();
                    } catch (err) {
                        showError(err.message);
                    }
                });

                const guardarEstado = async ({ cerrar = false } = {}) => {
                    const estado = document.getElementById("select-estado").value;
                    const observacion = document.getElementById("obs-estado")?.value.trim() || "";
                    if (estado === c.estado) return;
                    try {
                        const updated = await api.put(`/contratos/${c.id}/estado`, { estado, observacion });
                        showSuccess(`Estado actualizado a "${ESTADO_LABEL[updated.estado]}".`);
                        load();
                        if (cerrar) {
                            modal.classList.remove("show");
                        } else {
                            await openDetail(c.id);
                        }
                    } catch (err) {
                        showError(err.message);
                    }
                };

                // El estado se guarda automáticamente al elegirlo (ya no hay botón "Guardar estado").
                document.getElementById("select-estado").addEventListener("change", () => guardarEstado());

                document.getElementById("btn-upload-poliza")?.addEventListener("click", async () => {
                    const file = document.getElementById("file-poliza").files[0];
                    if (!file) { showError("Selecciona el archivo de la póliza."); return; }
                    const fd = new FormData();
                    fd.append("archivo", file);
                    try {
                        await api.postForm(`/contratos/${c.id}/poliza`, fd);
                        showSuccess("Póliza adjuntada correctamente.");
                        await openDetail(c.id);
                        load();
                    } catch (err) {
                        showError(err.message);
                    }
                });

                document.getElementById("btn-upload-borrador").addEventListener("click", async () => {
                    const file = document.getElementById("file-borrador").files[0];
                    if (!file) { showError("Selecciona el archivo del borrador."); return; }
                    const fd = new FormData();
                    fd.append("archivo", file);
                    try {
                        await api.postForm(`/contratos/${c.id}/borrador`, fd);
                        showSuccess("Contrato firmado adjuntado correctamente.");
                        await openDetail(c.id);
                        load();
                    } catch (err) {
                        showError(err.message);
                    }
                });

                document.getElementById("btn-delete-contrato").addEventListener("click", async () => {
                    const observacion = prompt(
                        `Escribe la observación para eliminar el contrato ${c.codigo}:`
                    );
                    if (observacion === null) return;
                    const motivo = observacion.trim();
                    if (!motivo) {
                        showError("La observación de eliminación es obligatoria.");
                        return;
                    }
                    const ok = confirm(`¿Seguro que deseas eliminar el contrato ${c.codigo}?`);
                    if (!ok) return;
                    try {
                        await api.delete(`/contratos/${c.id}?observacion=${encodeURIComponent(motivo)}`);
                        showSuccess(`Contrato ${c.codigo} eliminado correctamente.`);
                        modal.classList.remove("show");
                        load();
                    } catch (err) {
                        showError(err.message);
                    }
                });

                document.getElementById("btn-enviar-anticipo")?.addEventListener("click", async () => {
                    const fd = new FormData();
                    const obs = document.getElementById("obs-estado")?.value.trim() || "";
                    if (obs) fd.append("observacion", obs);
                    try {
                        await api.postForm(`/contratos/${c.id}/anticipo/enviar-contabilidad`, fd);
                        showSuccess("Anticipo enviado a Contabilidad.");
                        modal.classList.remove("show");
                        load();
                    } catch (err) {
                        showError(err.message);
                    }
                });

                // Mientras el anticipo está en Contabilidad/Tesorería, Jurídica no cambia
                // el estado manualmente (evita retroceder el flujo).
                const enAnticipo =
                    c.estado === "anticipo_contabilidad" || c.estado === "anticipo_tesoreria";
                const selEstado = document.getElementById("select-estado");
                if (selEstado) selEstado.disabled = enAnticipo;
            }

            document.getElementById("btn-detail-close").addEventListener("click", () =>
                modal.classList.remove("show")
            );

            // Botón notificar pendientes
            document.getElementById("btn-notificar").addEventListener("click", async () => {
                if (!confirm("¿Enviar correo con resumen de contratos en proceso a Jurídica?")) return;
                try {
                    const result = await api.post("/notifications/pendientes");
                    if (result.enviado) {
                        showSuccess(result.mensaje);
                    } else {
                        showError(result.mensaje || "No se pudo enviar el correo.");
                    }
                } catch (err) {
                    showError(err.message);
                }
            });

            document.getElementById("btn-vencimientos").addEventListener("click", async () => {
                if (!confirm("¿Enviar correo con contratos programados para notificar hoy?")) return;
                try {
                    const result = await api.post("/notifications/vencimientos");
                    if (result.enviado) {
                        showSuccess(result.mensaje);
                    } else {
                        showError(result.mensaje || "No se pudo enviar el correo.");
                    }
                } catch (err) {
                    showError(err.message);
                }
            });

            // Soporta apertura directa por querystring (?contrato=ID) desde correos.
            const urlParams = new URLSearchParams(window.location.search);
            const directoId = urlParams.get("contrato");

            load().then(() => {
                if (directoId) openDetail(directoId);
            });
        </script>
    </body>
</html>
