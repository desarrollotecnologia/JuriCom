<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/app/assets/dm1.ico?v=3" type="image/x-icon" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mis Solicitudes · Gestión de Solicitudes a Compras · JURICOM</title>
        <link rel="stylesheet" href="/static/styles/theme.css?v=7" />
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar" id="sidebar"></aside>
            <main class="main">
                <div class="page-header">
                    <div>
                        <h1 id="page-title">Mis Solicitudes</h1>
                        <p class="muted" id="page-subtitle"></p>
                    </div>
                    <div class="page-header-actions">
                        <a
                            href="/app/compras/gestion-solicitudes.html"
                            class="btn btn-secondary"
                        >
                            Volver
                        </a>
                        <a
                            href="/app/compras/nueva-solicitud.html"
                            class="btn btn-primary"
                        >
                            + Nueva solicitud
                        </a>
                    </div>
                </div>

                <div class="alert alert-error" id="alert-error"></div>
                <div class="alert alert-success" id="alert-success"></div>

                <div class="card">
                    <h2 class="card-title">Mis Solicitudes</h2>

                    <div class="search-bar">
                        <input
                            type="text"
                            id="gestion-search"
                            placeholder="Buscar por consecutivo, tipo o título..."
                            autocomplete="off"
                        />
                        <select id="gestion-filter-tipo">
                            <option value="">Todos los tipos</option>
                            <option value="compra">Solicitud de Compra</option>
                            <option value="salidas_almacen">Salidas de Almacén</option>
                            <option value="insumos_servicios">Solicitud de Servicios</option>
                        </select>
                        <span class="info" id="gestion-result-count"></span>
                    </div>

                    <div class="table-responsive">
                        <table class="table-gestion-solicitudes">
                            <thead>
                                <tr>
                                    <th>Consecutivo</th>
                                    <th>Título</th>
                                    <th>Tipo de Solicitud</th>
                                    <th>Estado</th>
                                    <th>Fecha de Registro</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="gestion-tbody">
                                <tr>
                                    <td colspan="6" class="muted text-center">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>

        <div class="modal-overlay" id="modal-gestion-detail">
            <div class="modal modal-wide modal-detail-solicitud">
                <div class="sg-modal-head">
                    <button
                        type="button"
                        class="sg-gear-btn"
                        id="btn-editar-revision"
                        hidden
                        title="Editar y reenviar ajustes"
                        aria-label="Editar solicitud"
                        aria-pressed="false"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                    <h2 id="gestion-detail-title">Detalle de la solicitud</h2>
                </div>
                <div class="sg-modal-detail-body">
                    <div id="gestion-detail-content"></div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="btn-gestion-detail-close">
                        Cerrar
                    </button>
                    <button
                        type="button"
                        class="btn btn-primary"
                        id="btn-mis-sol-reenviar-revision-footer"
                        hidden
                    >
                        Ajustar y reenviar a aprobación
                    </button>
                </div>
            </div>
        </div>

        <script type="module">
            import { requireSessionRole } from "/static/js/auth/bootstrap.js?v=2";
            import { renderSidebar } from "/static/js/components/sidebar.js";
            import { initMisSolicitudesGestion } from "/static/js/compras/mis-solicitudes-gestion.js?v=29";

            const user = await requireSessionRole(["compras", "admin", "solicitante", "anticipos"]);
            if (user) {
                renderSidebar();
                initMisSolicitudesGestion({ esAdmin: user.role === "admin" });
            } else {
                const tbody = document.getElementById("gestion-tbody");
                if (tbody && !window.location.pathname.endsWith("/login.html")) {
                    tbody.innerHTML =
                        '<tr><td colspan="5" class="muted text-center">Redirigiendo...</td></tr>';
                }
            }
        </script>
    </body>
</html>
